<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="image/title.png" type="image/png">
    <title>Admin Panel - BYTELOCK</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <h1>Admin Panel</h1>
        </div>
        <div class="nav-right">
            <button onclick="goHome()" class="nav-btn">Home</button>
            <button onclick="logout()" class="nav-btn logout-btn">Logout</button>
        </div>
    </nav>

    <canvas id="matrixCanvas"></canvas>

    <div class="admin-container">
        <div class="stats-cards">
            <div class="stat-card">
                <h3 id="totalUsers">0</h3>
                <p>Total Users</p>
            </div>
            <div class="stat-card">
                <h3 id="totalMessages">0</h3>
                <p>Total Messages</p>
            </div>
            <div class="stat-card">
                <h3 id="orphanMessages">0</h3>
                <p>Orphan Messages</p>
            </div>
        </div>

        <div class="users-section">
            <h2>All Users</h2>
            <div id="usersContainer" class="users-grid">
                <!-- Users will be loaded here -->
            </div>
        </div>
    </div>

    <!-- User Details Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content large">
            <span class="close" onclick="closeUserModal()">&times;</span>
            <div id="userDetails">
                <!-- User details will be loaded here -->
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
